<!-- ux: demo-apps/counter/src/pages/index/index.ux -->
<!-- State: goal of 100 reached (green, tick) and Reset armed, waiting for the confirming tap. -->
<div id="page" class="page">
  <div class="main">
    <div class="top">
      <div class="pill name-pill"><text class="pill-label">Reps ›</text></div>
      <div class="pill goal-pill goal-on">
        <div class="ring ring-on"><div class="dot dot-on"></div></div>
      </div>
    </div>
    <div class="tap">
      <text class="num n-3 done-col">100</text>
      <text class="line done-col">✓ 100</text>
    </div>
    <div class="bottom">
      <div class="btn minus"><text class="btn-label">−1</text></div>
      <div class="btn reset armed"><text class="btn-label small">Sure?</text></div>
    </div>
  </div>
</div>
